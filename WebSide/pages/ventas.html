<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto 1 - Bases de Datos 2</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <nav class="navbar">
    <a href="../index.html">Inicio</a>
    <a href="ventas.html">Ventas</a>
  </nav>

  <main>
    <h1>Gestión de ventas</h1>
    <a href="venta_form.html" class="btn-nuevo">+ Nueva venta</a>
    <div class="filtros">
      <input type="text" id="filtro-nombre" placeholder="Buscar por cliente...">

      <select id="filtro-metodo">
        <option value="">Todos los métodos de entrega</option>
      </select>

      <label>Desde <input type="date" id="filtro-desde"></label>
      <label>Hasta <input type="date" id="filtro-hasta"></label>

      <input type="number" id="filtro-monto-min" placeholder="Monto mínimo" min="0" step="0.01">
      <input type="number" id="filtro-monto-max" placeholder="Monto máximo" min="0" step="0.01">

      <button id="btn-buscar">Buscar</button>
      <button id="btn-restaurar" class="btn-secondary">Restaurar</button>
    </div>

    <div id="cargando">Cargando...</div>

    <table id="tabla-ventas" hidden>
      <thead>
        <tr>
          <th>Factura</th>
          <th>Fecha</th>
          <th>Cliente</th>
          <th>Método de entrega</th>
          <th>Monto</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div id="paginacion" class="paginacion" hidden>
      <button id="btn-anterior" class="btn-secondary">← Anterior</button>
      <span id="info-pagina"></span>
      <button id="btn-siguiente" class="btn-secondary">Siguiente →</button>
    </div>

    <p id="sin-resultados" hidden>No se encontraron facturas con esos filtros.</p>
    <pre id="error"></pre>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/ventas.js"></script>
</body>
</html>
