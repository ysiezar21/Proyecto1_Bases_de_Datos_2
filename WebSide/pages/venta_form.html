<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="titulo-tab">Proyecto 1 - Bases de Datos 2</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <nav class="navbar">
    <a href="../index.html">Inicio</a>
    <a href="ventas.html">Ventas</a>
  </nav>

  <main>
    <h1 id="titulo">Nueva venta</h1>
    <p>Los campos con * son obligatorios.</p>

    <form id="form-venta" class="formulario muy-ancho">
      <h2>Encabezado de la factura</h2>
      <div class="dos-columnas">
        <label>Cliente *
          <select id="cliente" required></select>
        </label>
        <label>Vendedor *
          <select id="vendedor" required></select>
        </label>
        <label>Fecha de la factura *
          <input type="date" id="fecha" required>
        </label>
        <label>Método de entrega *
          <select id="metodoEntrega" required></select>
        </label>
        <label>Número de orden
          <input type="text" id="numeroOrden" maxlength="20">
        </label>
      </div>
      <label>Instrucciones de entrega
        <textarea id="instrucciones" rows="3"></textarea>
      </label>

      <h2>Detalle de la factura</h2>
      <table class="tabla-lineas">
        <thead>
          <tr>
            <th>Producto *</th>
            <th>Cantidad *</th>
            <th>Precio unitario *</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="lineas"></tbody>
      </table>
      <button type="button" id="btn-agregar-linea" class="btn-secondary">+ Agregar producto</button>
      <p class="ayuda">El impuesto y el total de cada línea los calcula la base de datos al guardar; se ven en el detalle de la factura.</p>

      <button type="submit" id="btn-guardar">Guardar</button>
    </form>

    <p id="error" style="color: red;"></p>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/venta_form.js"></script>
</body>
</html>
