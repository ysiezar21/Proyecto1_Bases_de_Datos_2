<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proveedores</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <nav class="navbar">
    <a href="../index.html">Inicio</a>
    <a href="proveedores.html">Proveedores</a>
  </nav>

  <main>
    <h1>Gestión de proveedores</h1>

    <div class="filtros">
      <input type="text" id="filtro-nombre" placeholder="Buscar por nombre...">

      <select id="filtro-categoria">
        <option value="">Todas las categorías</option>
      </select>

      <select id="filtro-metodo">
        <option value="">Todos los métodos de entrega</option>
      </select>

      <button id="btn-buscar">Buscar</button>
      <button id="btn-restaurar" class="btn-secondary">Restaurar</button>
    </div>

    <div id="cargando">Cargando...</div>

    <table id="tabla-proveedores" hidden>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Categoría</th>
          <th>Método de entrega</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <p id="sin-resultados" hidden>No se encontraron proveedores con esos filtros.</p>
    <pre id="error"></pre>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/proveedores.js"></script>
</body>
</html>
